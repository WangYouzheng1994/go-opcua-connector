app_name: go-opcua-connector
pprof_port: 6023

log:
  level: info
  dir: ./logs
  max_age_day: 3
  max_size_mb: 100

opcua:
  endpoint: opc.tcp://localhost:49320
  certificate: "C:/certs/client.der"
  private_key: "C:/certs/client.key"
  username: ""
  password: ""
  security_policy: Basic256
  security_mode: SignAndEncrypt
  request_timeout: 30


mqtt:
  brokers: tcp://192.168.0.61:1883
  client_id: "xiaolu_go_opcua"
  username: ""
  password: ""
  topic: go_opcua/data
  qos: 1
  retained: false
  clean_session: true
  keepalive_sec: 60
  connect_timeout_sec: 10
  publish_timeout_sec: 5
  auto_reconnect: true
  max_reconnect_delay_sec: 60
  insecure_skip_verify: false

collector:
  output_type: mqtt
  batch_size: 100
  publish_timeout_ms: 5000
  stale_threshold_sec: 30
  heartbeat_interval_sec: 5
  subscription_retry_interval_sec: 30
  read_batch_size: 500
  read_timeout_sec: 10
  push_mode: timed
  push_interval_sec: 1
  filter_bad_quality: false
  subscription_nodes:
    - ns=2;s=t1.d1

writeback:
  write_subject: opcua/write
  result_subject: opcua/write/result
