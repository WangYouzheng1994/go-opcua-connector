app_name: go-opcua-connector
pprof_port: 6023

log:
  level: info
  dir: ./logs
  max_age_day: 3
  max_size_mb: 100

opcua:
  endpoint: opc.tcp://localhost:49320
  certificate: "C:/certs/client.der"
  private_key: "C:/certs/client.key"
  username: ""
  password: ""
  security_policy: Basic256
  security_mode: SignAndEncrypt
  request_timeout: 200

nats:
  urls: nats://192.168.0.69:4222
  username: ""
  password: ""
  max_reconnects: -1
  reconnect_wait_ms: 1000

mqtt:
  brokers: tcp://192.168.0.61:1883
  client_id: "xiaolu_go_opcua"
  username: ""
  password: ""
  topic: go_opcua/data
  qos: 0
  retained: false
  clean_session: true
  keepalive_sec: 60
  connect_timeout_sec: 10
  publish_timeout_sec: 5
  auto_reconnect: true
  max_reconnect_delay_sec: 60
  insecure_skip_verify: false

collector:
  output_type: mqtt
  worker_count: 10
  batch_size: 100
  channel_buffer_size: 10000
  publish_timeout_ms: 5000
  subscription_topic: opcua/data
  monitor_interval_sec: 60
  stale_threshold_sec: 30
  heartbeat_interval_sec: 5
  push_mode: timed
  push_interval_sec: 1
  force_heartbeat: true
  filter_bad_quality: true
  subscription_nodes:
    - ns=2;s=t1.d1.*

writeback:
  write_subject: opcua/write
  result_subject: opcua/write/result
